name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Offline + fast: never call Claude, use hashing embeddings instead of downloading the model.
      TRIAGE_DISABLE_LLM: "1"
      TRIAGE_EMBEDDINGS: hash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-lite.txt  # Lite edition: no torch, fast to install

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Unit tests
        run: pytest -q --cov=app --cov=triageai --cov-report=term

      - name: Eval smoke test
        run: python eval/evaluate.py --smoke

      - name: No secrets committed
        run: |
          # Pattern is written as sk-an[t] so this file does not match itself.
          if git log -p | grep -iE "sk-an[t]-"; then echo "Found an Anthropic key in git history"; exit 1; fi
