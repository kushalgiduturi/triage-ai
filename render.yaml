# Fallback deployment: Render Blueprint (Dashboard -> New -> Blueprint -> pick this repo).
# One container: FastAPI serves the API and the React UI on $PORT.
services:
  - type: web
    name: triage-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Embeddings run on ONNX Runtime (no torch), so the app fits the free 512 MB instance.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: ANTHROPIC_API_KEY
        sync: false # set the value in the Render dashboard; never commit it
